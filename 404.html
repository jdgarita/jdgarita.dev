<!DOCTYPE html>
<html lang="en" data-i18n-base="/">
<head>
    <!--
      404 page. GitHub Pages serves this file for any missing path at any
      depth, so every asset and the i18n base use root-absolute URLs.
      Reuses the root css/custom.css and js/custom.js; not indexed.
    -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />

    <title data-i18n="notfound.title">Page not found</title>

    <link rel="icon" href="/image/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/image/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/image/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/image/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/image/favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

    <link href="/css/font-awesome.min.css" rel="stylesheet" type="text/css" />
    <link href="/css/custom.css" rel="stylesheet" type="text/css" />

    <!-- Inline no-FOUC theme + lang setter (mirrors /index.html). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored || (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          var storedLang = localStorage.getItem('lang');
          var lang = storedLang || ((navigator.language || 'en').toLowerCase().indexOf('es') === 0 ? 'es' : 'en');
          document.documentElement.setAttribute('lang', lang);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
</head>
<body>
    <!-- =========================== HEADER =========================== -->
    <header class="site-header">
        <div class="container nav-row">
            <a href="/" class="brand" aria-label="Juan Diego Garita">
                <span class="brand-mark">JD</span>
                <span class="brand-name">Juan Diego Garita</span>
            </a>

            <div class="header-controls" style="margin-left: auto;">
                <button type="button" class="icon-btn" id="lang-toggle"
                        data-i18n-attr="aria-label:a11y.langToggle">
                    <span id="lang-toggle-label">EN</span>
                </button>
                <button type="button" class="icon-btn" id="theme-toggle"
                        data-i18n-attr="aria-label:a11y.themeToggle">
                    <i class="fa fa-moon-o" aria-hidden="true" id="theme-icon-dark"></i>
                    <i class="fa fa-sun-o"  aria-hidden="true" id="theme-icon-light"></i>
                </button>
            </div>
        </div>
    </header>

    <main id="main">
        <section id="hero" class="hero" aria-labelledby="hero-title">
            <div class="container hero-inner">
                <p class="hero-eyebrow">404</p>
                <h1 id="hero-title" class="hero-title" data-i18n="notfound.title">Page not found</h1>
                <p class="hero-description" data-i18n="notfound.body">The page you're looking for doesn't exist or has moved.</p>

                <div class="hero-ctas">
                    <a class="btn btn-primary" href="/" data-i18n="notfound.cta">Back to home</a>
                </div>
            </div>
            <div class="hero-glow" aria-hidden="true"></div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-row">
            <p>© <span id="footer-year">2026</span> Juan Diego Garita. <span data-i18n="footer.rights">All rights reserved.</span></p>
        </div>
    </footer>

    <script src="/js/custom.js"></script>
</body>
</html>
